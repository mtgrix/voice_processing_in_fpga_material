[project]
name = "voice-edge-jetson-to-fpga"
version = "0.1.0"
description = "From Jetson Orin to FPGA: An open-source executable monograph and research framework on edge voice AI hardware acceleration."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"  # PEP 639 SPDX string; the table form is unsupported for builds after 2027-02-18
authors = [{ name = "Voice Edge AI Contributors" }]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
audio = [
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
]
ml = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]
book = [
    # scripts/extract_pdf_text.py reads the built PDF's text layer, the only way
    # scripts/verify_book_pdf.sh can check a document it cannot otherwise parse.
    # Not in dev: the CI gate does not build a PDF. 1.24 is the release where
    # "pymupdf" became the canonical module name.
    "pymupdf>=1.24.0",
]

[tool.setuptools]
# Nothing in this repository is meant to be imported from site-packages. The chapters are
# scripts run in place, pytest imports them by path, and book/ and docs/ are prose. Left to
# itself, setuptools' flat-layout autodiscovery reads book/, capstone/ and chapter01..10/ as
# top-level packages and refuses to build at all, which is what made `pip install -e .` fail.
# The install exists to bring in the dependency and dev-extras set, not to ship a module.
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N806", "N803"]  # Allow math notation uppercase variables (e.g. X, W, A, B)

[tool.mypy]
python_version = "3.12"
strict = true
# The chapter directories are run as scripts, not installed packages, so the repository root is
# intentionally on the search path. Without this mypy resolves every file twice under
# two different module names and aborts before checking anything.
explicit_package_bases = true
mypy_path = [".", "scripts/verification"]

[[tool.mypy.overrides]]
# This script reads the built PDF, and PyMuPDF is only needed to build one, so CI
# does not install it. Without the package mypy reports the import as missing; with
# the package, PyMuPDF leaves some of its own definitions unannotated and strict mode
# refuses the calls. Both facts belong to an optional dependency, not to this file, so
# the codes are disabled here instead of being papered over with "type: ignore"
# comments -- which were each wrong, and reported as unused, in whichever of the two
# environments did not produce them. That is what failed CI on the first push.
module = "scripts.extract_pdf_text"
disable_error_code = ["import-not-found", "no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests", "chapter01", "chapter02"]
addopts = "-v --tb=short"
